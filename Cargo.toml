[workspace]
resolver = "2"
members = ["crates/rscatiacli", "crates/rscatiacli-tools"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/chenghaowan/rscatiacli"
homepage = "https://github.com/chenghaowan/rscatiacli"

[workspace.dependencies]
serde_json = "1"
rust_xlsxwriter = "0.79"
sysinfo = "0.33"
# 截图后处理（rule_bounding_box / measure_harness）：解码 PNG → 裁剪/缩放 → 256 色 PNG8
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.17"
color_quant = "1.1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }
